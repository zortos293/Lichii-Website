name: lichii-db

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./state/tls:/etc/postgresql/tls:ro
    shm_size: 256m
    mem_limit: 1536m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [db]

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

networks:
  db:
    ipam:
      config:
        - subnet: 10.231.64.0/24

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./state/secrets/postgres_password
  tunnel_token:
    file: ./state/secrets/tunnel_token
